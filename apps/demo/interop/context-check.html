<!doctype html>
<html><head><meta charset="utf-8"><title>Mango context — live check</title></head>
<body><pre id="out">running…</pre>
<script src="https://cdn.jsdelivr.net/npm/jsonld@8/dist/jsonld.min.js"></script>
<script>
(async () => {
  const log = [];
  // 1. raw cross-origin fetch — this is what CORS governs
  try {
    const r = await fetch("https://mangoviewer.dev/schema/story/1/context.json");
    log.push("cross-origin fetch: OK " + r.status);
  } catch (e) {
    log.push("cross-origin fetch: BLOCKED — " + e.message);
  }
  // 2. full JSON-LD expansion using the live context
  const doc = {
    "@context": [
      "http://www.w3.org/ns/anno.jsonld",
      "https://mangoviewer.dev/schema/story/1/context.json",
      "http://iiif.io/api/presentation/3/context.json"
    ],
    id: "https://example.org/story", type: "AnnotationPage",
    items: [{
      id: "https://example.org/story/c1", type: "Annotation", motivation: "describing",
      "mango:role": "chapter",
      body: [{ type: ["Dataset", "mango:ViewerState"],
               format: "application/vnd.mango.story-state+json",
               mangoState: { viewBox: { x: 1, y: 2, w: 3, h: 4 } } }],
      target: "https://example.org/canvas/1#xywh=1,2,3,4"
    }]
  };
  try {
    const ex = await jsonld.expand(doc);
    const ann = ex[0]["http://www.w3.org/ns/activitystreams#items"][0]["@list"][0];
    const body = ann["http://www.w3.org/ns/oa#hasBody"][0];
    log.push("expand with live context: OK");
    log.push("  mangoState: " + JSON.stringify(body["https://mangoviewer.dev/schema/story#state"]));
  } catch (e) {
    log.push("expand with live context: FAILED — " + e.message);
  }
  document.getElementById("out").textContent = log.join("\n");
})();
</script></body></html>
