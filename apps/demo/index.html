<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mango Story Viewer Demo</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <div class="page page--story-viewer">
      <header class="hero">
        <div class="hero__title">Mango Story Viewer</div>
      </header>

      <section class="viewer-shell">
        <div class="story-picker">
          <label for="story-picker">Story</label>
          <select id="story-picker"></select>
        </div>

        <mango-viewer
          mode="story-viewer"
          story-url="test-story/demo.json"
          config='{"showThumbnails":false,"showSearch":false,"showMetadata":false,"showAnnotations":false,"showTools":false}'
        ></mango-viewer>

        <nav class="viewer-actions" aria-label="Story actions">
          <a class="viewer-actions__link" href="story-edit.html">Edit this story</a>
          <a class="viewer-actions__link" href="story-builder.html">
            Build a story from scratch
          </a>
          <a class="viewer-actions__link" href="annotation-editor.html">
            Open annotation editor
          </a>
          <a class="viewer-actions__link" href="annotation-editor-wellcome.html">
            Open Wellcome annotation editor
          </a>
          <a class="viewer-actions__link" href="viewer-cdn.html">
            Open CDN viewer demo
          </a>
          <a class="viewer-actions__link" href="cookbook.html">
            Open cookbook demo
          </a>
          <a class="viewer-actions__link" href="config.html">
            Configure the viewer
          </a>
          <a class="viewer-actions__link" href="story-layers.html">
            Layers Transition Demo
          </a>
          <a class="viewer-actions__link" href="embed-third-party.html">
            Third-party embed harness
          </a>
        </nav>
      </section>
    </div>

    <script type="module" src="dist/mango-viewer-element.js"></script>
    <script>
      /*
       * The published stories are served from GitHub Pages, which sets
       * `access-control-allow-origin: *`, so this page can load them straight
       * from the domain they are actually published on rather than from a
       * local copy that might have drifted.
       */
      const PUBLISHED = 'https://404mike.github.io/uv4-manifest/mango/stories';
      const STORIES = [
        { label: 'Demo story (local)', url: 'test-story/demo.json' },
        { label: 'Layers transition (local)', url: 'test-story/layers.json' },
        { label: 'Paris Street; Rainy Day', url: `${PUBLISHED}/paris-street-rainy-day.json` },
        { label: 'The Bedroom', url: `${PUBLISHED}/the-bedroom.json` },
        { label: 'Stoke-by-Nayland', url: `${PUBLISHED}/stoke-by-nayland.json` },
        { label: 'St John on Patmos', url: `${PUBLISHED}/st-john-patmos.json` },
        { label: 'Fountain, Villa Torlonia', url: `${PUBLISHED}/fountain-villa-torlonia.json` },
        { label: 'Göttingen (plain AnnotationPage)', url: `${PUBLISHED}/gottingen-story.json` },
      ];

      const picker = document.getElementById('story-picker');
      const viewer = document.querySelector('mango-viewer');

      for (const { label, url } of STORIES) {
        const option = document.createElement('option');
        option.value = url;
        option.textContent = label;
        picker.append(option);
      }

      // A story in the query string makes a particular one linkable, and
      // survives the reload that switching stories performs.
      const requested = new URLSearchParams(location.search).get('story');
      if (requested && STORIES.some((s) => s.url === requested)) {
        picker.value = requested;
        viewer.setAttribute('story-url', requested);
      }

      picker.addEventListener('change', () => {
        const url = new URL(location.href);
        url.searchParams.set('story', picker.value);
        /*
         * Reload rather than swapping the attribute in place. The element
         * builds a good deal of state from the story it opened with, and
         * starting clean is what a reader switching stories expects anyway.
         */
        location.assign(url.toString());
      });
    </script>
  </body>
</html>
